kind = "web"
previewPath = "/"
title = "The Unified Spirit — Soul Blueprint"
version = "1.0.0"
id = "artifacts/unified-self"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20676

[services.development]
run = "pnpm --filter @workspace/unified-self run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/unified-self", "run", "build" ]
publicDir = "artifacts/unified-self/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20676"
BASE_PATH = "/"
